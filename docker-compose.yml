version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: bropay-mongo
    restart: always
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bropay-backend
    ports:
      - "8080:8080"
      - "9092:9092"
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}

  frontend:
    build:
      context: ./frontend
    container_name: bropay-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8080

volumes:
  mongo-data:
